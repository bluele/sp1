[package]
name = "sp1-core-executor-runner"
description = "A crate wrapping native executor in a separate process"
readme = "../../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
sp1-core-executor = { workspace = true }
sp1-core-executor-runner-binary = { workspace = true }
sp1-jit = { workspace = true }
sp1-primitives = { workspace = true }

base64 = { workspace = true }
bincode = { workspace = true }
hashbrown = { workspace = true }
libc = { workspace = true }
sysinfo = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[build-dependencies]
sp1-core-executor = { workspace = true }
sp1-core-executor-runner-binary = { workspace = true }

cargo_metadata = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
sp1-core-machine = { workspace = true }
test-artifacts = { path = "../../test-artifacts" }
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true

[features]
default = []
profiling = ["sp1-core-executor/profiling"]
mprotect = ["sp1-core-executor/mprotect", "sp1-core-executor-runner-binary/mprotect"]
# Selects the portable runner when `sp1-core-executor/portable` is enabled elsewhere: the
# build script detects the executor with its own copy of `sp1-core-executor`, whose features
# come only from this package.
portable = ["sp1-core-executor/portable"]
